version: "3.9"

services:
  bot:
    build: .
    env_file:
      - .env
    depends_on:
      - db
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-santa}
      POSTGRES_USER: ${POSTGRES_USER:-santa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-santa}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  pgdata: {}
